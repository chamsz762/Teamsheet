<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeamSheet</title>
<meta name="description" content="TeamSheet – voetbalteam beheren: spelers, opstelling, wedstrijden en statistieken.">
<meta name="theme-color" content="#0b3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeamSheet">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<script>
(function(){try{var v=localStorage.getItem('teamsheet_theme');var d=v==='dark'||(v==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="header" class="top"></header>
  <main id="main"></main>
  <nav id="nav" class="bottom" aria-label="Hoofdmenu"></nav>
</div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">TeamSheet heeft JavaScript nodig.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
